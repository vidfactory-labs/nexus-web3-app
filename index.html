<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- ✅ PWA Config Links -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <title>NEXUS Super App</title>
    <style>
        body { margin: 0; background: #0b0f19; font-family: sans-serif; }
        .loader { padding: 20px; }
        .loader h1 { font-size: 2.5rem; color: #00ffcc; text-align: center; }
        .loader p { color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <!-- ✅ Import App.js here (Zaroori) -->
    <script src="/App.js" type="module"></script>

    <!-- Loader (App.js load hone se pehle) -->
    <div class="loader" id="root">
        <h1>⚡ NEXUS</h1>
        <p>Loading Super App...</p>
    </div>

    <!-- ✅ Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ NEXUS PWA Registered'))
                .catch(err => console.log('❌ PWA Error:', err));
            });
        }
    </script>
</body>
</html>
