<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <title>NEXUS Super App</title>
    <style>
        body { margin: 0; background: #0b0f19; font-family: sans-serif; padding: 20px; }
        #root { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 3rem; font-weight: 900; color: #00ffcc; letter-spacing: 2px; }
        .subtext { color: #64748b; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .label { color: #94a3b8; margin-bottom: 10px; }
        .input { width: 100%; background: #0f172a; padding: 16px; border-radius: 12px; color: white; font-size: 1.2rem; margin-bottom: 15px; }
        .actionBtn { width: 100%; padding: 16px; background: #00ffcc; color: #0b0f19; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .status { color: #64748b; text-align: center; margin-top: 15px; }
        .shieldTitle { color: #00ffcc; font-size: 1.3rem; font-weight: bold; }
        .shieldDesc { color: #94a3b8; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
